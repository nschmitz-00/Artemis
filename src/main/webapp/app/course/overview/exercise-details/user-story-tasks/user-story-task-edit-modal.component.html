<tum-ui-dialog [(visible)]="visible" [header]="headerStringKey() | artemisTranslate" [closable]="true" [closeOnEscape]="true" [dismissableMask]="false" size="medium">
    <div class="d-flex flex-column gap-4">
        <div>
            <label class="fw-semibold d-block mb-1" for="task-edit-title" jhiTranslate="artemisApp.courseOverview.exerciseDetails.tasks.title"></label>
            <input
                id="task-edit-title"
                tumUiInput
                class="w-100"
                [attr.maxlength]="MAX_TITLE_LENGTH"
                [ngModel]="draftTitle()"
                (ngModelChange)="draftTitle.set($event)"
                [placeholder]="'artemisApp.courseOverview.exerciseDetails.tasks.titlePlaceholder' | artemisTranslate"
                [tumUiInputInvalid]="!isTitleValid()"
            />
        </div>

        <div>
            <label class="fw-semibold d-block mb-1" for="task-edit-description" jhiTranslate="artemisApp.courseOverview.exerciseDetails.tasks.description"></label>
            <textarea
                id="task-edit-description"
                tumUiInput
                class="w-100"
                rows="3"
                [ngModel]="draftDescription()"
                (ngModelChange)="draftDescription.set($event)"
                [placeholder]="'artemisApp.courseOverview.exerciseDetails.tasks.descriptionPlaceholder' | artemisTranslate"
            ></textarea>
        </div>

        <div class="d-flex flex-wrap gap-3">
            <div>
                <label class="fw-semibold d-block mb-1" for="task-edit-points" jhiTranslate="artemisApp.courseOverview.exerciseDetails.tasks.points"></label>
                <tum-ui-input-number
                    inputId="task-edit-points"
                    [ngModel]="draftTaskPoints()"
                    (ngModelChange)="draftTaskPoints.set($event)"
                    [min]="0"
                    [maxFractionDigits]="0"
                    [showButtons]="true"
                />
            </div>
            <div>
                <label class="fw-semibold d-block mb-1" for="task-edit-effort" jhiTranslate="artemisApp.courseOverview.exerciseDetails.tasks.estimatedEffort"></label>
                <input
                    id="task-edit-effort"
                    tumUiInput
                    class="w-20"
                    [ngModel]="draftEstimatedEffortText()"
                    (ngModelChange)="draftEstimatedEffortText.set($event)"
                    placeholder="hh:mm"
                    [tumUiInputInvalid]="draftEstimatedEffortHours() === undefined"
                />
            </div>
        </div>

        <div>
            <label class="fw-semibold d-block mb-1" jhiTranslate="artemisApp.courseOverview.exerciseDetails.tasks.priority"></label>
            <ng-template #priorityItemTpl let-option>
                <span [jhiTranslate]="option.labelKey"></span>
            </ng-template>
            <tum-ui-select-button
                [options]="priorityOptions"
                optionValue="value"
                [allowEmpty]="false"
                [itemTemplate]="priorityItemTpl"
                [ngModel]="draftPriority()"
                (ngModelChange)="draftPriority.set($event)"
            />
        </div>

        @if (!isNew()) {
            <div>
                <label class="fw-semibold d-block mb-1" jhiTranslate="artemisApp.courseOverview.exerciseDetails.tasks.stateLabel"></label>
                <ng-template #stateItemTpl let-option>
                    <span [jhiTranslate]="option.labelKey"></span>
                </ng-template>
                <tum-ui-select-button
                    [options]="stateOptions"
                    optionValue="value"
                    [allowEmpty]="false"
                    [itemTemplate]="stateItemTpl"
                    [ngModel]="draftState()"
                    (ngModelChange)="draftState.set($event)"
                />
            </div>
        }
    </div>

    <ng-template #footer>
        <tum-ui-button severity="secondary" variant="text" (clicked)="onCancel()">
            <span jhiTranslate="entity.action.cancel"></span>
        </tum-ui-button>
        <tum-ui-button [disabled]="isSaveDisabled()" (clicked)="onSave()">
            <span jhiTranslate="entity.action.save"></span>
        </tum-ui-button>
    </ng-template>
</tum-ui-dialog>
